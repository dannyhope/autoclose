<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Autoclose marquee</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      width: 1400px; height: 560px;
      background: #F0F2F2;
      color: #1A272C;
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; align-items: center; gap: 48px; padding: 64px 80px;
    }
    img { width: 160px; height: 160px; }
    h1 { margin: 0 0 12px; font-size: 56px; font-weight: 700; }
    p { margin: 0; font-size: 24px; color: #4B565A; max-width: 36rem; line-height: 1.35; }
  </style>
</head>
<body>
  <img src="../../src/icons/icon-128.png" alt="">
  <div>
    <h1>Auto-close tabs</h1>
    <p>Keep a list of sites that are always safe to close, then shut matching tabs in one click.</p>
  </div>
</body>
</html>
